<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura de Caja</title>
    <link rel="stylesheet" href="../../../src/style.css">
    
</head>
<body>
    <main>
        <div class="card">
            <h2>VENTAS</h2> 
            <div id="alert-box" class="alert hidden"></div>      
            
            <form id="venta-form">
                <div class="form-group">
                    <label for="id_cliente">ID CLIENTE</label>
                    <select id="id_cliente" required></select>

                    <label for="id_condicion">CONDICION DE PAGO</label>
                    <select id="id_condicion" required></select>

                    <label for="id_forma">FORMA DE PAGO</label>
                    <select id="id_forma" required></select>

                </div>
                <fieldset>
                    <legend>DETALLE DE VENTA</legend>
                        <div class="panel-carga">
                            
                                <label for="id_item">ITEM</label>
                                <select id="id_item"></select>

                            <input type="number" id="input-cantidad" placeholder="Cantidad" min="1">
                            <button type="button" id="btn-add-row" class="btn-secondary">+ Agregar Fila</button>

                        </div>
                </fieldset>
                    <table class="tabla-detalle">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Precio Unitario</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body">

                        </tbody>
                    </table>
                    
                    <div class="total-container">
                    <span>TOTAL DECLARADO: </span>
                    <output id="total-general" class="total-monto">Gs. 0</output>
                    </div>
                
                <button type="submit" class="btn-primary">CONFIRMAR</button>
            </form>
        </div>

        <div id="factura-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Generar Factura</h2>
                <p id="factura-venta-info"></p>
                <form id="factura-form">
                    <label for="id_tipo_documento">ID TIPO DE DOCUMENTO</label>
                    <select id="id_tipo_documento" required></select>

                    <button type="submit" class="btn-primary">GENERAR</button>

                    <button type="button" id="omitir-factura" class="btn-secondary">OMITIR</button>
                </form>
            </div>
        </div>
    </main>
    <script src="api.js"></script>
    <script src="venta.js"></script>
</body>
</html>
